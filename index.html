<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On the Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232340C8'/><circle cx='16' cy='16' r='6' fill='%23F5B700'/></svg>">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>On the Spot</span>
      </div>
      <p class="muted">Sign in to open the till.</p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span id="shop-name">On the Spot</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="rate-chip" id="rate-chip" title="Exchange rate used for LBP"></div>
        <div class="me">
          <div>
            <strong id="me-name"></strong>
            <span class="muted" id="me-role"></span>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-password" type="button">Password</button>
          <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">Sign out</button>
        </div>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
